<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sheet-native demo</title>
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/Sheet.css" />
    <link rel="stylesheet" href="../src/sheet.css" />
    <style>
      body { margin: 0; padding: 16px; font-family: system-ui; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
    </style>
    <script type="module">
      import { Sheet } from '../src/index.js';
      // One Sheet per trigger root, outer sheets first (nested ones sit inside the outer content).
      for (const root of document.querySelectorAll('[data-sheet-part="trigger"]')) {
        new Sheet(root);
      }
    </script>
  </head>
  <body>
    <h1>sheet-native</h1>
    <p><a href="playground.html">Open the playground</a></p>

    <!-- 1. Basic bottom sheet -->
    <div data-sheet-part="trigger">
      <button class="react-aria-Button" id="open-basic">Basic sheet</button>
      <div data-sheet-part="overlay">
        <div data-sheet-part="backdrop" data-sheet-swipe-animation="sheet-backdrop"></div>
        <div data-sheet-part="panel" data-sheet-overscroll-padding data-sheet-stack-animation="sheet-scale-back">
          <div class="sheet-handle"></div>
          <div data-sheet-part="content">
            <h2 slot="title" class="react-aria-Heading">Basic sheet</h2>
            <p slot="description">Swipe down, press Escape or use the button to close.</p>
            <button slot="close" class="react-aria-Button">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Snap points: opens at 180px, then 50% of the sheet -->
    <div data-sheet-part="trigger">
      <button class="react-aria-Button" id="open-snap">Snap points</button>
      <div data-sheet-part="overlay" data-sheet-snap-points="180, 50%">
        <div data-sheet-part="backdrop" data-sheet-swipe-animation="sheet-backdrop" data-sheet-swipe-animation-range="1"></div>
        <div data-sheet-part="panel" data-sheet-overscroll-padding data-sheet-stack-animation="sheet-scale-back">
          <div class="sheet-handle"></div>
          <div data-sheet-part="content">
            <h2 slot="title" class="react-aria-Heading">Snap points</h2>
            <p slot="description">Opens at 180px. Swipe up for 50%, then full height.</p>
            <button slot="close" class="react-aria-Button">Close</button>
            <div style="height: 800px">Filler text, 800px tall.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Non-dismissible: blocks swipe, Escape and outside press -->
    <div data-sheet-part="trigger">
      <button class="react-aria-Button" id="open-locked">Non-dismissible</button>
      <div data-sheet-part="overlay" data-sheet-prevent-dismissal>
        <div data-sheet-part="backdrop" data-sheet-swipe-animation="sheet-backdrop"></div>
        <div data-sheet-part="panel" data-sheet-overscroll-padding data-sheet-stack-animation="sheet-scale-back">
          <div data-sheet-part="content">
            <h2 slot="title" class="react-aria-Heading">Non-dismissible</h2>
            <p slot="description">Only the button closes this sheet.</p>
            <button slot="close" class="react-aria-Button">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. Stacked: a nested sheet inside the parent's content -->
    <div data-sheet-part="trigger">
      <button class="react-aria-Button" id="open-stack">Stacked sheets</button>
      <div data-sheet-part="overlay">
        <div data-sheet-part="backdrop" data-sheet-swipe-animation="sheet-backdrop"></div>
        <div data-sheet-part="panel" style="height: 550px" data-sheet-overscroll-padding data-sheet-stack-animation="sheet-scale-back">
          <div class="sheet-handle"></div>
          <div data-sheet-part="content">
            <h2 slot="title" class="react-aria-Heading">Parent sheet</h2>
            <button slot="close" class="react-aria-Button">Close</button>
            <div data-sheet-part="trigger">
              <button class="react-aria-Button" id="open-child">Open child</button>
              <div data-sheet-part="overlay">
                <div data-sheet-part="backdrop" data-sheet-swipe-animation="sheet-backdrop"></div>
                <div data-sheet-part="panel" style="height: 550px" data-sheet-overscroll-padding data-sheet-stack-animation="sheet-scale-back">
                  <div class="sheet-handle"></div>
                  <div data-sheet-part="content">
                    <h2 slot="title" class="react-aria-Heading">Child sheet</h2>
                    <button slot="close" class="react-aria-Button">Close child</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 5. Right-hand sheet -->
    <div data-sheet-part="trigger">
      <button class="react-aria-Button" id="open-right">Right sheet</button>
      <div data-sheet-part="overlay" data-sheet-position="right">
        <div data-sheet-part="backdrop" data-sheet-swipe-animation="sheet-backdrop"></div>
        <div data-sheet-part="panel" data-sheet-overscroll-padding data-sheet-stack-animation="sheet-scale-back">
          <div class="sheet-handle"></div>
          <div data-sheet-part="content">
            <h2 slot="title" class="react-aria-Heading">Right sheet</h2>
            <button slot="close" class="react-aria-Button">Close</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
